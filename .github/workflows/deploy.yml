name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Auto-sync vault content every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule content)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pull latest vault content (auto-sync)
        run: |
          cd content
          git fetch origin main
          git checkout origin/main
          echo "Vault submodule now at:"
          git log --oneline -1
          cd ..

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-v2-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-v2-

      - name: Install npm dependencies
        run: npm ci

      - name: Ensure Quartz CLI is executable
        run: chmod +x quartz/bootstrap-cli.mjs

      - name: Install Quartz plugins
        run: node ./quartz/bootstrap-cli.mjs plugin install

      - name: Build Quartz
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5